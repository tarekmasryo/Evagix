name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  RUFF_NO_CACHE: "true"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade -c constraints-release.txt pip setuptools wheel
          python -m pip install -c constraints-release.txt -e ".[dev]"

      - name: Static compile check
        run: python -m compileall -q evagix tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: Format verification
        run: python -m ruff format --check .

      - name: Typecheck
        run: python -m mypy evagix

      - name: Tests with coverage
        run: python -m pytest --cov=evagix --cov-branch --cov-report=term-missing --cov-fail-under=80

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade -c constraints-release.txt pip setuptools wheel
          python -m pip install -c constraints-release.txt -e ".[dev]"

      - name: Cross-platform test suite
        run: python -m pytest -q

  self-governance:
    name: Evagix self-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Evagix
        run: |
          python -m pip install --upgrade -c constraints-release.txt pip setuptools wheel
          python -m pip install --no-build-isolation -e .

      - name: Evagix gates
        run: |
          python -m evagix audit .
          python -m evagix check .
          python -m evagix doctor . --strict --fail-under 80
          python -m evagix readme-audit . --strict --fail-on unsupported
          python -m evagix eval-context . --strict --fail-on high

      - name: Fixture smoke tests
        run: |
          python -m evagix check tests/fixtures/basic-python
          python -m evagix doctor tests/fixtures/basic-python --fail-under 80

  build:
    name: Build immutable release artifacts
    needs: [quality, test, self-governance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade -c constraints-release.txt pip setuptools wheel
          python -m pip install -c constraints-release.txt build twine

      - name: Build wheel and source distribution once
        run: python -m build --no-isolation

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Build and verify the source ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          source_archive="evagix-$package_version-source.zip"
          source_prefix="evagix-$package_version/"
          git archive --format=zip --prefix="$source_prefix" --output="$source_archive" HEAD
          python scripts/verify_source_archive.py "$source_archive" --repository . --revision HEAD --prefix "$source_prefix"
          sha256sum "$source_archive" > SOURCE_SHA256SUMS

      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum dist/* > SHA256SUMS

      - name: Upload tested release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evagix-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evagix-release-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload the verified source ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evagix-source-zip
          path: |
            evagix-*-source.zip
            SOURCE_SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  artifact-smoke:
    name: Clean artifact installation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download the exact artifacts built by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evagix-release-dist
          path: dist

      - name: Install and smoke-test wheel and sdist independently
        run: python scripts/verify_artifacts.py dist

  advisory-pr-review:
    name: Evagix advisory PR review
    needs: [quality, test, self-governance, build, artifact-smoke]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check out the reviewed verification tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tarekmasryo/Evagix
          ref: 491b5e6a890cdb6934c1dae3933dd8be105c3549
          path: verification-tool
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the reviewed verification tool
        working-directory: ${{ runner.temp }}
        env:
          TOOL_SOURCE: ${{ github.workspace }}/verification-tool
        run: |
          python -I -m venv "$RUNNER_TEMP/evagix-summary-env"
          "$RUNNER_TEMP/evagix-summary-env/bin/python" -I -m pip install --upgrade \
            -c "$TOOL_SOURCE/constraints-release.txt" pip setuptools wheel
          "$RUNNER_TEMP/evagix-summary-env/bin/python" -I -m pip install \
            --no-build-isolation --no-deps "$TOOL_SOURCE"

      - name: Fetch inspected commits as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
          path: inspected

      - name: Publish advisory review summary
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        env:
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVAGIX_GITHUB_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/evagix-pr-review.md"
          set +e
          "$RUNNER_TEMP/evagix-summary-env/bin/python" -I -m evagix.pr_summary \
            "$PR_URL" --repo "$GITHUB_WORKSPACE/inspected" \
            --base "$BASE_SHA" --head "$HEAD_SHA" > "$report"
          review_status=$?
          set -e
          if [[ ( "$review_status" == 0 || "$review_status" == 1 ) && -s "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit "$review_status"
          fi
          printf '%s\n' '## Evagix review unavailable' '' \
            'The review could not inspect matching committed inputs and GitHub evidence. See the operational error; no clean result is implied.' \
            >> "$GITHUB_STEP_SUMMARY"
          exit 2
