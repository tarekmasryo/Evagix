name: Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evagix/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "constraints-release.txt"
      - "MANIFEST.in"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-pypi.yml"
      - ".github/workflows/security-audit.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install a clean audit toolchain
        run: |
          python -m pip install --upgrade -c constraints-release.txt pip setuptools wheel
          python -m pip install -c constraints-release.txt -e ".[dev,security]"
          python -m pip check

      - name: Run focused Python security static analysis
        run: python -m ruff check evagix --select S --ignore S105,S110,S112,S404,S603,S607

      - name: Audit development, build, and security dependencies
        run: python -m pip_audit
